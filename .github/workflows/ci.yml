name: CI

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '25'
  PYTHON_VERSION: '3.14'

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Python (engine) -- quality checks (run in parallel)
  # ===========================================================================

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGAMA compiles with -march=native, so its wheel dies with SIGILL on a runner
      # whose CPU lacks an instruction set of the runner that built it.
      - name: Identify CPU instruction sets
        id: cpu
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          echo "isa=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          # The cache keeps the AGAMA wheel, which takes ~18 min to build from source.
          # It is keyed on the CPU instruction sets, so a wheel only reaches CPUs that can run it.
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cpu-${{ steps.cpu.outputs.isa }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (with AGAMA)
        run: uv sync --group auriga

      - name: Check formatting (black)
        run: uv run black --check packages/experiments/src packages/experiments/tests

      - name: Check import order (isort)
        run: uv run isort --check-only packages/experiments/src packages/experiments/tests

      - name: Lint (flake8)
        run: uv run flake8 packages/experiments/src packages/experiments/tests

      - name: Lint (pylint)
        run: uv run pylint packages/experiments/src

      - name: Docstrings (pydocstyle)
        run: uv run pydocstyle packages/experiments/src

  typecheck-python:
    name: Typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGAMA compiles with -march=native, so its wheel dies with SIGILL on a runner
      # whose CPU lacks an instruction set of the runner that built it.
      - name: Identify CPU instruction sets
        id: cpu
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          echo "isa=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          # The cache keeps the AGAMA wheel, which takes ~18 min to build from source.
          # It is keyed on the CPU instruction sets, so a wheel only reaches CPUs that can run it.
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cpu-${{ steps.cpu.outputs.isa }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (with AGAMA)
        run: uv sync --group auriga

      - name: Run mypy (strict)
        run: uv run mypy packages/experiments/src packages/experiments/tests

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGAMA compiles with -march=native, so its wheel dies with SIGILL on a runner
      # whose CPU lacks an instruction set of the runner that built it.
      - name: Identify CPU instruction sets
        id: cpu
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          echo "isa=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          # The cache keeps the AGAMA wheel, which takes ~18 min to build from source.
          # It is keyed on the CPU instruction sets, so a wheel only reaches CPUs that can run it.
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: cpu-${{ steps.cpu.outputs.isa }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (with AGAMA)
        run: uv sync --group auriga

      - name: Run tests + coverage gate
        working-directory: packages/experiments
        run: uv run pytest

  # ===========================================================================
  # Docs (JS/TS) -- quality checks (run in parallel)
  # ===========================================================================

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Since v5 the action caches the package manager on its own, which runs yarn
          # before Corepack is enabled below; the yarn cache is not used here.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: ESLint
        run: yarn lint

      - name: Prettier
        run: yarn format

  typecheck-js:
    name: Typecheck (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Since v5 the action caches the package manager on its own, which runs yarn
          # before Corepack is enabled below; the yarn cache is not used here.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript
        run: yarn typecheck

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Since v5 the action caches the package manager on its own, which runs yarn
          # before Corepack is enabled below; the yarn cache is not used here.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build docs site
        run: yarn workspace @jr-hz-mono-age/docs build
